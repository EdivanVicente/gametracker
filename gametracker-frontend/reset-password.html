<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameTracker Pro — Redefinir senha</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="assets/css/style.css?v=1786831772">
  <script src="assets/js/config.js?v=1786831772"></script>
  <script src="assets/js/theme.js?v=1786831772"></script>
  <script src="assets/js/i18n.js?v=1786831772"></script>
</head>
<body>

  <main class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">

          <div class="d-flex align-items-center gap-2 mb-4 justify-content-center">
            <i class="bi bi-joystick fs-3" style="color: var(--gt-accent);"></i>
            <span class="gt-brand fs-4">GameTracker <span class="gt-brand-mark">Pro</span></span>
            <div class="ms-auto" data-gt-lang-switcher></div>
          </div>

          <div class="gt-panel p-4 p-md-5">
            <h4 class="gt-display mb-1 text-center" data-i18n="resetPassword.title">Redefinir senha</h4>
            <p class="text-white-50 small text-center mb-4" data-i18n="resetPassword.subtitle">Escolha uma nova senha para sua conta.</p>

            <div id="reset-form-wrapper">
              <div class="mb-3">
                <label for="reset-new-password" class="form-label small text-white-50" data-i18n="resetPassword.newPassword">Nova senha</label>
                <div class="gt-password-field">
                  <input type="password" class="form-control" id="reset-new-password" placeholder="••••••••">
                  <button type="button" class="gt-password-toggle" data-target="reset-new-password" tabindex="-1" data-i18n-aria-label="auth.showPassword" data-i18n-title="auth.showPassword" aria-label="Mostrar senha" title="Mostrar senha">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
              <div class="mb-3">
                <label for="reset-confirm-password" class="form-label small text-white-50" data-i18n="resetPassword.confirmPassword">Confirmar nova senha</label>
                <div class="gt-password-field">
                  <input type="password" class="form-control" id="reset-confirm-password" placeholder="••••••••">
                  <button type="button" class="gt-password-toggle" data-target="reset-confirm-password" tabindex="-1" data-i18n-aria-label="auth.showPassword" data-i18n-title="auth.showPassword" aria-label="Mostrar senha" title="Mostrar senha">
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>
              <div class="form-text mb-3" data-i18n="auth.passwordHint">Mínimo 8 caracteres, com maiúscula, minúscula, número e caractere especial.</div>

              <div class="gt-field-error text-danger small mb-3 d-none" id="reset-error"></div>

              <button type="button" class="btn btn-gt-primary w-100 py-2" id="btn-reset-password" data-i18n="resetPassword.submit">Redefinir senha</button>
            </div>

            <div id="reset-success-wrapper" class="d-none text-center">
              <i class="bi bi-check-circle fs-1 mb-3 d-block" style="color: var(--gt-success);"></i>
              <p class="mb-4" data-i18n="resetPassword.successMessage">Senha redefinida com sucesso!</p>
              <a href="index.html" class="btn btn-gt-primary w-100 py-2" data-i18n="resetPassword.goToLogin">Ir para o login</a>
            </div>

            <div id="reset-invalid-wrapper" class="d-none text-center">
              <i class="bi bi-x-circle fs-1 mb-3 d-block" style="color: var(--gt-danger);"></i>
              <p class="mb-4" data-i18n="resetPassword.invalidLink">Este link é inválido ou já expirou.</p>
              <a href="index.html" class="btn btn-gt-outline w-100 py-2" data-i18n="resetPassword.backToLogin">Voltar ao login</a>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/password-toggle.js?v=1786831772"></script>
  <script src="assets/js/reset-password.js?v=1786831772"></script>
</body>
</html>
